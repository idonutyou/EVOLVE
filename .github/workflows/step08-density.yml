name: STEP08 actual 50 180 250 living-monster density review
on:
  push:
    branches: [step08-combat-playtest-v614-20261027]
    paths:
      - '.github/workflows/step08-density.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  density:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Guard V614 and native browser game files
        run: |
          node --check tests/combat_density_step08_browser.cjs
          python3 tools/verify_monster_feedback_v614.py
      - name: Install Chrome for repeatable fixed dt CPU workload
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"; fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Profile 50, 180, 250 actual enemy instances and render calls
        run: node tests/combat_density_step08_browser.cjs
      - name: Save density report and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step08-density-evidence
          path: test-results/step08/
          if-no-files-found: ignore

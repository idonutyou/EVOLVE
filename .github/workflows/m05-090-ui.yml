name: M05 90 percent UI hitbox, integration and merge readiness
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-090-ui.yml'
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Keep 80 percent baseline and original M04 store gate unchanged
        run: |
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --check web/m05-shop-ui-v618.js
          node --check tests/monetization_m05_090_touch_browser.cjs
      - name: Build 90 percent opt-in DEV trigger placement fix
        run: |
          python3 tools/build_m05_090.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m05_090_release.py
      - name: Run M04/M05 original mock engine and 62 contract tests
        run: |
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Set up mobile Chrome runner
        run: |
          npm install --prefix "$RUNNER_TEMP/m05-090-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/m05-090-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m05-090-browser/node_modules" >> "$GITHUB_ENV"
      - name: Test REAL touch on five home tabs plus 80 percent core/combat safety
        timeout-minutes: 23
        run: |
          node tests/monetization_m05_090_touch_browser.cjs
          node tests/monetization_m05_080_integration_browser.cjs
          node tests/monetization_m05_070_browser.cjs
          node tests/monetization_m05_060_browser.cjs
          node tests/monetization_m05_050_browser.cjs
          node tests/monetization_m04_home_browser.cjs
      - name: Save actual touch and gameplay screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m05-090-mobile-touch-and-combat
          path: |
            test-results/m05-090-touch-*.png
            test-results/m05-080-combat-safety.png
          if-no-files-found: ignore
      - name: Commit fully tested dist changes to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/verification.json dist/asset-manifest.json
          git add -- 'dist/assets/*.js'
          git commit -m "build(M05 90%): tested original-safe DEV trigger hitbox release candidate"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028

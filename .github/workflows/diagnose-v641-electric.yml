name: EVOLVE V641 electric targeted diagnosis
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-v641-electric.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pages-fast-evolve-20261029
          sparse-checkout: |
            assets/04ec4ce23eaddf3917dab7c7a5357a32e7a1fc7382218e869fc8eca5c307cd74.js
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Print precise lightning and enemy health drawing code
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('assets/04ec4ce23eaddf3917dab7c7a5357a32e7a1fc7382218e869fc8eca5c307cd74.js')
          ls=p.read_text().splitlines()
          for a,b in [(12390,12500),(13295,13345),(4330,4370),(3610,3670)]:
            print("====== LINES",a,b,"======")
            for n in range(a-1,b):
              print(str(n+1).rjust(5),ls[n][:1900])
          PY

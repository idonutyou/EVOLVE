name: M07 070 read-only text season preview
on:
  push:
    branches: ["monetization-m07-retention-*"]
    paths:
      - "monetization/m07/**"
      - "tests/m07_070_text_preview.test.cjs"
      - ".github/workflows/m07-070-text-preview.yml"
  workflow_dispatch:
jobs:
  preview-protection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: M07 10 through 70 percent regression
        run: |
          node tests/m07_010_nonrender_design.test.cjs
          node tests/m07_020_period_contract.test.cjs
          node tests/m07_020_paid_month_policy.test.cjs
          node tests/m07_030_api_release_freeze.test.cjs
          node tests/m07_040_mission_harness.test.cjs
          node tests/m07_050_journal_restore.test.cjs
          node tests/m07_060_atomic_batch.test.cjs
          node tests/m07_070_text_preview.test.cjs
      - name: Guard original game, images, SHOP, and price catalog
        run: |
          git diff --name-only b73c848a781e30453c3e003de673a98143fa5d42 HEAD > /tmp/m07_070_modified.txt
          if grep -E '^(dist/|web/|art/|assets/|monetization/m06/|monetization/catalog/|monetization/economy/)' /tmp/m07_070_modified.txt; then
            echo 'M07 isolated 70-percent preview must not change the existing game or SHOP.'
            exit 1
          fi

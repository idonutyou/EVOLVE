name: M08 070-080 research rewards acceptance
on:
  push:
    branches: ["monetization-m08-010-*"]
    paths:
      - "web/shop-experience-v621.js"
      - "dist/shop-experience-v621.js"
      - "web/m08-mission-rewards-v624.js"
      - "dist/m08-mission-rewards-v624.js"
      - "tests/m08_040_mission_rewards.test.cjs"
      - "tests/m08_040_mission_rewards_browser.cjs"
      - ".github/workflows/m08-040-rewards.yml"
      - "tests/m08_060_monthly_boundary.test.cjs"
      - "tests/m08_070_reward_ux.test.cjs"
      - "tests/m08_080_release_gate.test.cjs"
      - "checkpoints/EVOLVE_M08_080_20261029.json"
      - "tools/verify_m08_060_checkpoint.py"
      - "checkpoints/EVOLVE_M08_060_20261029.*"
  workflow_dispatch:
jobs:
  reward-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: M08 10-80 and M07 SHOP sensitive regression
        run: |
          node --check web/shop-experience-v621.js
          node --check web/m08-mission-rewards-v624.js
          node tests/m08_040_mission_rewards.test.cjs
          node tests/m08_060_monthly_boundary.test.cjs
          node tests/m08_070_reward_ux.test.cjs
          node tests/m08_080_release_gate.test.cjs
          node tests/m08_010_live_stage.test.cjs
          node tests/m08_020_runtime_missions.test.cjs
          node tests/m08_030_integration.test.cjs
          node tests/m07_080_shop_experience.test.cjs
          node tests/m07_090_crimson_pass.test.cjs
          node tests/m07_100_final_contract.test.cjs
      - name: Verify M08 60% incremental ZIP SHA256 CRC and byte-for-byte source
        run: python tools/verify_m08_060_checkpoint.py
      - name: Strict originals protection and scope
        run: |
          git diff --name-only e7b89f0b768e645924a3a332e1c25663a5547ffb HEAD > /tmp/m08_040_changed
          if grep -E '^(web/|dist/|art/|assets/)' /tmp/m08_040_changed | grep -Ev '^(web/shop-experience-v621\.js|dist/shop-experience-v621\.js|web/m08-mission-rewards-v624\.js|dist/m08-mission-rewards-v624\.js|dist/index\.html)$'; then
            echo "Protected combat/image/shop UI file changed"; exit 1
          fi
      - name: Browser setup
        run: |
          npm install --prefix "$RUNNER_TEMP/m08-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            "$RUNNER_TEMP/m08-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m08-browser/node_modules" >> "$GITHUB_ENV"
      - name: Browser 320 393 852 reward and CHALLENGE integration
        timeout-minutes: 8
        run: |
          node tests/m08_030_integration_browser.cjs
          node tests/m08_040_mission_rewards_browser.cjs

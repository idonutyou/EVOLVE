name: M04 80 predeploy regression
on:
  push:
    branches: [monetization-m04-payment-20261027]
    paths:
      - 'tools/verify_m04_*gate.py'
      - 'tools/verify_monster_feedback_v614.py'
      - 'tests/monster_feedback_browser_v614.cjs'
      - '.github/workflows/m04-80-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify installed game and original asset hashes
        run: |
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_art_gate.py
          python3 tools/verify_m04_predeploy_gate.py
          python3 tools/verify_monster_feedback_v614.py
      - name: Run old gameplay and new mock purchase unit regression
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/web_client.test.cjs
          node --test tests/weapon_hits_v612.test.cjs tests/organ_hits_v613.test.cjs tests/monster_feedback_v614.test.cjs
          node --test tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs

name: V620 final native SHOP safe-main release gate
on:
  push:
    branches: [feature/native-shop-unification-20261028]
    paths:
      - '.github/workflows/native-shop-final-gate.yml'
permissions:
  contents: read
jobs:
  native-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 14 deleted DEV UI JS assets and all game/image bytes unchanged
        run: |
          python3 tools/verify_native_shop_v620.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_monster_feedback_v614.py
          python3 tools/verify_m04_predeploy_gate.py
      - name: Run original Python game contracts and JavaScript engine tests
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/web_client.test.cjs
          node --test tests/weapon_hits_v612.test.cjs tests/organ_hits_v613.test.cjs tests/monster_feedback_v614.test.cjs
      - name: Confirm only one SHOP page still active in normal game
        run: |
          node --check web/native-shop-v620.js
          node --check tests/native_shop_v620_browser.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('dist');html=(root/'index.html').read_text()
          assert len(re.findall('data-native-shop=',html))==3
          assert 'data-m05-dev-only' not in html and 'data-m04-dev-only' not in html
          m=json.loads((root/'asset-manifest.json').read_text())
          assert len(m)==1072
          assert sum(a['kind']=='image' for a in m)==1021
          print('NATIVE V620 release gate: one SHOP, no old overlay, original art preserved.')
          PY

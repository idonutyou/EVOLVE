name: M05 30 percent frozen mobile UX checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-030-checkpoint.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Design checks and unchanged original website
        run: |
          python3 tools/verify_site.py --dist dist
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Generate frozen UX recovery ZIP and verify member SHA256
        run: |
          python3 tools/checkpoint_m05_030.py
          python3 tools/verify_m05_030_checkpoint.py
      - name: Persist recovery ZIP without force-push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_030_20261028.zip checkpoints/EVOLVE_M05_030_20261028.json
          git commit -m "checkpoint(M05): verified 30 percent STEP 1 design freeze"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Fetch remote committed ZIP again and verify independent hashes and CRC
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_030_20261028.zip > "$RUNNER_TEMP/m05-030-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_030_20261028.json > "$RUNNER_TEMP/m05-030-remote.json"
          python3 - "$RUNNER_TEMP/m05-030-remote.zip" "$RUNNER_TEMP/m05-030-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          raw=open(sys.argv[1],'rb').read()
          m=json.load(open(sys.argv[2]))
          assert len(raw)==m['bytes']
          assert hashlib.sha256(raw).hexdigest()==m['sha256']
          assert m['stage']=='M05' and m['percent']==30
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'MANIFEST.json'}
              for p,info in m['files'].items():
                  b=z.read(p)
                  assert len(b)==info['bytes'] and hashlib.sha256(b).hexdigest()==info['sha256']
          print('M05 30% PERSISTED REMOTE ZIP VERIFIED',m['bytes'],m['sha256'])
          PY

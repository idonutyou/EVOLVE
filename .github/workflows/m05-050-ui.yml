name: M05 50 percent owner/equip mobile UX integration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feature-build:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve M04 game contract and syntax
        run: |
          node --check web/m05-shop-ui-v618.js
          node --check tests/monetization_m05_050_browser.cjs
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Append hash-named UX50 asset, preserve game data and originals
        run: |
          python3 tools/build_m05_050.py
          python3 tools/verify_site.py --dist dist
      - name: Install Chrome for interactive mobile checks
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/m05-050-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/m05-050-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m05-050-browser/node_modules" >> "$GITHUB_ENV"
      - name: Run actual 393x852 and 320x568 shop ownership and equip tests
        timeout-minutes: 14
        run: node tests/monetization_m05_050_browser.cjs
      - name: Keep mobile proof screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m05-050-owned-mobile
          path: test-results/m05-050-owned-*.png
          if-no-files-found: ignore
      - name: Commit and push tested 50 percent feature build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/verification.json dist/asset-manifest.json
          git add -- 'dist/assets/*.js'
          git commit -m "build(M05 50%): real-browser-tested owned/equip UX feature website"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028

name: M05 70 percent immutable responsive UX checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-070-checkpoint.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate feature site, all originals and full 62 prior tests
        run: |
          node --check web/m05-shop-ui-v618.js
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Build SHA256/CRC recovery ZIP and independently verify original game
        run: |
          python3 tools/checkpoint_m05_070.py
          python3 tools/verify_m05_070_checkpoint.py
      - name: Persist immutable recovery ZIP and manifest on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_070_20261028.zip checkpoints/EVOLVE_M05_070_20261028.json
          git commit -m "checkpoint(M05): 70 percent mobile responsive implementation and verified recovery ZIP"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Fetch remote ZIP again, assert committed bytes/CRC and every member SHA
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_070_20261028.zip > "$RUNNER_TEMP/m05-070-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_070_20261028.json > "$RUNNER_TEMP/m05-070-remote.json"
          python3 - "$RUNNER_TEMP/m05-070-remote.zip" "$RUNNER_TEMP/m05-070-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          b=open(sys.argv[1],'rb').read()
          m=json.load(open(sys.argv[2]))
          assert m['stage']=='M05' and m['percent']==70
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert m['actual_billing_enabled'] is False
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'CHECKPOINT_MANIFEST.json'}
              for path,item in m['files'].items():
                  raw=z.read(path)
                  assert len(raw)==item['bytes'] and hashlib.sha256(raw).hexdigest()==item['sha256']
          print('M05 70% REMOTE ZIP VERIFIED',m['bytes'],m['sha256'],m['file_count'])
          PY

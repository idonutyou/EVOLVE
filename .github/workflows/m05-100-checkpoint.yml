name: M05 100 percent immutable final handoff and published recovery
on:
  workflow_run:
    workflows: ["M05 100 percent ACTUAL GitHub Pages live commerce shell QA"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  complete-and-archive:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful real Pages and actually published mobile tests
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          live_id="${{ github.event.workflow_run.id }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            live_id="$(gh api 'repos/${{ github.repository }}/actions/workflows/m05-100-live-final.yml/runs?branch=main&per_page=15' --jq '[.workflow_runs[] | select(.conclusion=="success")][0].id')"
          fi
          test -n "$live_id" && test "$live_id" != null
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$live_id" --jq '.conclusion')" = success
          pages_id="$(gh api 'repos/${{ github.repository }}/actions/workflows/deploy-pages.yml/runs?branch=main&per_page=20' --jq '[.workflow_runs[] | select(.conclusion=="success")][0].id')"
          test -n "$pages_id" && test "$pages_id" != null
          test "$(gh api "repos/${{ github.repository }}/actions/runs/$pages_id" --jq '.conclusion')" = success
          echo "M05_LIVE_RUN_ID=$live_id" >> "$GITHUB_ENV"
          echo "M05_PAGES_RUN_ID=$pages_id" >> "$GITHUB_ENV"
          echo "Public release evidence: pages=$pages_id, actual live browser=$live_id"
      - name: Revalidate exact unchanged game and release billing safety
        run: |
          python3 tools/verify_m05_090_release.py
          python3 tools/verify_monster_feedback_v614.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Stamp genuine release evidence into final docs and preserve all handoffs
        run: |
          python3 tools/finalize_m05_100.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- EVOLVE_PROGRESS.md EVOLVE_HANDOFF.md EVOLVE_ROADMAP.md docs/monetization/M05_100_LIVE_FINAL_QA_KO.md
          git commit -m "docs(M05 100%): actual published Pages and real mobile store QA success"
          git push origin HEAD:refs/heads/main
      - name: Archive last ten percent without changing original game and check CRC SHA
        run: |
          python3 tools/checkpoint_m05_100.py
          python3 tools/verify_m05_100_checkpoint.py
      - name: Commit immutable ZIP to main and freeze complete full-tree recovery branch
        run: |
          git add -- checkpoints/EVOLVE_M05_100_20261028.zip checkpoints/EVOLVE_M05_100_20261028.json
          git commit -m "checkpoint(M05): final 100 percent successful public Pages recovery ZIP"
          git push origin HEAD:refs/heads/main
          git push origin HEAD:refs/heads/backup/monetization-m05-100-20261028
      - name: Fetch both remote refs independently and verify SHA ZIP CRC all member bytes
        run: |
          git fetch origin main backup/monetization-m05-100-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/backup/monetization-m05-100-20261028)"
          git show origin/backup/monetization-m05-100-20261028:checkpoints/EVOLVE_M05_100_20261028.zip > "$RUNNER_TEMP/m05-100-remote.zip"
          git show origin/main:checkpoints/EVOLVE_M05_100_20261028.json > "$RUNNER_TEMP/m05-100-remote.json"
          python3 - "$RUNNER_TEMP/m05-100-remote.zip" "$RUNNER_TEMP/m05-100-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          b=open(sys.argv[1],'rb').read()
          m=json.load(open(sys.argv[2]))
          assert m['stage']=='M05' and m['percent']==100
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert not m['real_billing_enabled'] and m['original_images']==1021
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'CHECKPOINT_MANIFEST.json'}
              for path,v in m['files'].items():
                  data=z.read(path)
                  assert len(data)==v['bytes'] and hashlib.sha256(data).hexdigest()==v['sha256']
          print('M05 100% ORIGINAL GAME + PUBLIC QA + REMOTE ZIP PASSED',m['bytes'],m['sha256'],m['file_count'])
          PY

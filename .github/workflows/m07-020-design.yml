name: M07 020 UTC mission/source safety contract
on:
  push:
    branches:
      - "monetization-m07-retention-*"
    paths:
      - "monetization/m07/**"
      - "tests/m07_020_period_contract.test.cjs"
      - "tests/m07_020_paid_month_policy.test.cjs"
      - ".github/workflows/m07-020-design.yml"
  workflow_dispatch:
jobs:
  period-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - name: Run M07 10 and 20 percent contracts
        run: |
          node tests/m07_010_nonrender_design.test.cjs
          node tests/m07_020_period_contract.test.cjs
          node tests/m07_020_paid_month_policy.test.cjs
      - name: Protect original game, premium data and non-render policy
        run: |
          git diff --name-only b73c848a781e30453c3e003de673a98143fa5d42 HEAD > /tmp/m07-020-files.txt
          if grep -E '^(dist/|web/|art/|assets/|monetization/catalog/|monetization/economy/|monetization/m06/)' /tmp/m07-020-files.txt; then
            echo 'No original game, art, SKU, or M06 changes allowed'
            exit 1
          fi

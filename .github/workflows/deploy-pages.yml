name: Publish EVOLVE Web

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "asset-bundles/**"
      - ".github/workflows/deploy-pages.yml"
      - "tools/verify_site.py"
      - "tools/asset_bundles.py"
      - "tests/browser_smoke.cjs"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evolve-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Restore verified original assets
        run: python3 tools/asset_bundles.py unpack --dist dist --bundles asset-bundles
      - name: Refuse to publish an empty or incomplete game
        shell: bash
        run: |
          test -s dist/index.html || { echo "ERROR: playable game index.html is missing"; exit 1; }
          test -s dist/version.json || { echo "ERROR: game version manifest is missing"; exit 1; }
          test -s dist/asset-manifest.json || { echo "ERROR: original asset manifest is missing"; exit 1; }
          test -d dist/assets || { echo "ERROR: extracted game images are missing"; exit 1; }
          python3 tools/verify_site.py --dist dist
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify mobile boot, maps, controls, saves and safe updates
        timeout-minutes: 10
        run: node tests/browser_smoke.cjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-browser-verification
          path: test-results
          if-no-files-found: ignore
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload verified website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

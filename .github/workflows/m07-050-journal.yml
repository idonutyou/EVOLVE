name: M07 050 journal and restore safety
on:
  push:
    branches: ["monetization-m07-retention-*"]
    paths:
      - "monetization/m07/**"
      - "tests/m07_050_journal_restore.test.cjs"
      - ".github/workflows/m07-050-journal.yml"
  workflow_dispatch:
jobs:
  test-journal:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check M07 10 through 50 percent contracts
        run: |
          node tests/m07_010_nonrender_design.test.cjs
          node tests/m07_020_period_contract.test.cjs
          node tests/m07_020_paid_month_policy.test.cjs
          node tests/m07_030_api_release_freeze.test.cjs
          node tests/m07_040_mission_harness.test.cjs
          node tests/m07_050_journal_restore.test.cjs
      - name: No changes to original game, catalog or M06 art
        run: |
          git diff --name-only b73c848a781e30453c3e003de673a98143fa5d42 HEAD > /tmp/m07-050-changes.txt
          if grep -E '^(dist/|web/|art/|assets/|monetization/m06/|monetization/catalog/|monetization/economy/)' /tmp/m07-050-changes.txt; then
            echo 'Protected original files changed.'
            exit 1
          fi

name: M05 40 percent permanent UI recovery checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-040-checkpoint.yml'
      - 'tests/monetization_m05_ux_design.test.cjs'
      - 'tests/monetization_m05_mobile_flow.test.cjs'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm saved feature build, images and 62 existing tests
        run: |
          node --check web/m05-shop-ui-v618.js
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Create 40 percent ZIP and independently verify original M04 bytes
        run: |
          python3 tools/checkpoint_m05_040.py
          python3 tools/verify_m05_040_checkpoint.py
      - name: Persist 40 percent ZIP and evidence on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_040_20261028.zip checkpoints/EVOLVE_M05_040_20261028.json
          git commit -m "checkpoint(M05): 40 percent tested opt-in UI plus permanent ZIP recovery"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Independently retrieve and CRC/hash committed remote recovery ZIP
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_040_20261028.zip > "$RUNNER_TEMP/m05-040-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_040_20261028.json > "$RUNNER_TEMP/m05-040-remote.json"
          python3 - "$RUNNER_TEMP/m05-040-remote.zip" "$RUNNER_TEMP/m05-040-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          b=open(sys.argv[1],'rb').read();m=json.load(open(sys.argv[2]))
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert m['percent']==40 and not m['real_checkout']
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'MANIFEST.json'}
              for p,d in m['files'].items():
                  content=z.read(p)
                  assert len(content)==d['bytes'] and hashlib.sha256(content).hexdigest()==d['sha256']
          print('M05 40% REMOTE CHECKPOINT VERIFIED',m['bytes'],m['sha256'],m['file_count'])
          PY

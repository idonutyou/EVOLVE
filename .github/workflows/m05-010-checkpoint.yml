name: M05 10 percent durable verified checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-010-checkpoint.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm original site and generate M05 incremental recovery
        run: |
          python3 tools/verify_site.py --dist dist
          python3 tools/checkpoint_m05.py --percent 10
          python3 tools/verify_m05_checkpoint.py
      - name: Persist original archive in feature branch without force
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_010_20261028.zip checkpoints/EVOLVE_M05_010_20261028.json
          git commit -m "checkpoint(M05): verified 10 percent UX design recovery bundle"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Independently retrieve and verify persisted remote ZIP and CRC
        shell: bash
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_010_20261028.zip > "$RUNNER_TEMP/m05-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_010_20261028.json > "$RUNNER_TEMP/m05-remote.json"
          python3 - "$RUNNER_TEMP/m05-remote.zip" "$RUNNER_TEMP/m05-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          p,q=sys.argv[1:]
          raw=open(p,'rb').read()
          meta=json.load(open(q))
          assert hashlib.sha256(raw).hexdigest()==meta['sha256']
          assert len(raw)==meta['bytes']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(meta['files'])|{'CHECKPOINT_MANIFEST.json'}
              for name,entry in meta['files'].items():
                  body=z.read(name)
                  assert hashlib.sha256(body).hexdigest()==entry['sha256']
          print('M05 REMOTE CHECKPOINT VERIFIED',meta['sha256'],meta['bytes'],'bytes')
          PY

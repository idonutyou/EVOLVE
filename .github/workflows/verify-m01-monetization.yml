name: M01 secure product and transaction contract tests
# Milestone 80 includes security gate probes plus 40 production acceptance gates.
# No live provider calls, no Pages deploy and no source asset changes.
on:
  push:
    branches: [monetization-m01-contracts-20261027]
    paths:
      - "monetization/**"
      - "tests/monetization*.test.cjs"
      - ".github/workflows/verify-m01-monetization.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Run fail-closed business logic and contract assertions (no API secrets)
        run: |
          node --version
          node --test tests/monetization*.test.cjs
      - name: Verify 40 real-revenue release gates are not misreported as passed
        run: |
          node -e "const x=require('./docs/monetization/M01_ACCEPTANCE_AUDIT_080.json'); if(x.total!==40||x.production_accepted!==0||x.checks.some(c=>c.production_acceptance_passed!==false)) process.exit(1)"
      - name: Verify production V614 was not modified
        run: |
          python3 tools/verify_monster_feedback_v614.py

name: Verify EVOLVE migration tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/test-migration.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/test-migration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile tools/split_embedded_assets.py tests/test_split_assets.py
      - name: Extraction tests
        run: python -m unittest discover -s tests -v

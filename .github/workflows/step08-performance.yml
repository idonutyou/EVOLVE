name: STEP08 isolated realtime 60-second V614 browser sample
on:
  push:
    branches: [step08-combat-playtest-v614-20261027]
    paths:
      - '.github/workflows/step08-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  realtime-60:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm unmodified published engine and test source
        run: |
          node --check tests/combat_playtest_step08_browser.cjs
          python3 tools/verify_monster_feedback_v614.py
      - name: Use headless mobile-viewport Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"; fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Play 60 actual seconds with original requestAnimationFrame loop
        env:
          STEP08_MODE: realtime
          STEP08_PHASE: '60'
          STEP08_DURATION_S: '60'
        run: node tests/combat_playtest_step08_browser.cjs
      - name: Retain actual timestamps and frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step08-realtime-60-v614
          path: test-results/step08/
          if-no-files-found: ignore

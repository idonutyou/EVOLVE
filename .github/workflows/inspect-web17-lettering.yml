name: Verify final WEB-17 lettering layout
on:
  push:
    branches: [online-v575]
    paths: [".github/workflows/inspect-web17-lettering.yml"]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-v575
          fetch-depth: 1
      - name: Complete uncut Korean label regions and package final build
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          git fetch origin d8f6d2eaa6aa28a884c3eb2a3c5009c5711353af --depth=1
          python3 tools/finalize_reference_labels_v584.py
          python3 tools/package_reference_lettering_v584.py
          python3 tools/verify_site.py --dist dist
          python3 -m unittest discover -s tests -v
          node tests/boss_cinematic.test.cjs
      - name: Prepare native browser
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify both locales and capture final Korean screens
        run: node tests/boss_cinematic_browser.cjs
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-web17-final-lettering-verification
          path: test-results
          if-no-files-found: ignore
      - name: Save final verified build and visual review files
        run: |
          python3 - <<'PY'
          import base64,json,shutil
          from pathlib import Path
          d=Path('docs/web17-review');d.mkdir(exist_ok=True)
          index={}
          for kind in ['venom','bio']:
              for orientation in ['portrait','landscape']:
                  source=Path(f'test-results/cinematic-ko-{kind}-{orientation}.png')
                  target=Path(f'docs/reference-lettering-ko-{kind}-{orientation}-v584.png')
                  shutil.copyfile(source,target)
                  encoded=base64.b64encode(source.read_bytes()).decode();parts=[]
                  for i,start in enumerate(range(0,len(encoded),500000)):
                      chunk=d/f'{kind}-{orientation}-{i}.txt';chunk.write_text(encoded[start:start+500000]);parts.append(str(chunk))
                  index[f'{kind}-{orientation}']={'parts':parts,'bytes':source.stat().st_size}
          (d/'screens.json').write_text(json.dumps(index)+'\n')
          shutil.copyfile('test-results/boss-cinematic-browser.json','docs/REFERENCE_LETTERING_BROWSER_REPORT.json')
          p=Path('docs/reference-lettering-v584-checkpoint.json');c=json.loads(p.read_text())
          c.update(progress=90,status='Final English boss names and uncut Korean labels verified in portrait and landscape; exact VENOM aspect and poison-free BIO confirmed',next='Review final native screenshots and deploy automatically',corrections_pending={},physical_Galaxy_S23_plus_tested=False)
          c['validation'].update(final_korean_cutouts='complete, no adjacent glyphs',native_screenshots=['docs/reference-lettering-ko-'+kind+'-'+orientation+'-v584.png' for kind in ['bio','venom'] for orientation in ['portrait','landscape']])
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- dist web/warning-branding-art-v581.json docs
          git commit -m "[skip ci] WEB-17 90%: verify complete Korean cutouts and native final screens"
          git pull --rebase origin online-v575
          git push origin HEAD:online-v575

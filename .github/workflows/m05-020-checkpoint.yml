name: M05 20 percent verified product UX checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-020-checkpoint.yml'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing web image hashes and product detail design
        run: |
          python3 tools/verify_site.py --dist dist
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Make isolated 20 percent recovery ZIP and validate original game bytes
        run: |
          python3 tools/checkpoint_m05_020.py
          python3 tools/verify_m05_020_checkpoint.py
      - name: Commit real checkpoint ZIP and manifest to M05 feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_020_20261028.zip checkpoints/EVOLVE_M05_020_20261028.json
          git commit -m "checkpoint(M05): verified 20 percent detail and state UX recovery ZIP"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Retrieve independently persisted ZIP and verify remote bytes and CRC
        shell: bash
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_020_20261028.zip > "$RUNNER_TEMP/m05-020-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_020_20261028.json > "$RUNNER_TEMP/m05-020-remote.json"
          python3 - "$RUNNER_TEMP/m05-020-remote.zip" "$RUNNER_TEMP/m05-020-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          p,q=sys.argv[1:];meta=json.load(open(q));blob=open(p,'rb').read()
          assert len(blob)==meta['bytes'] and hashlib.sha256(blob).hexdigest()==meta['sha256']
          assert meta['percent']==20 and meta['archive_crc_and_member_hashes_verified'] is True
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(meta['files'])|{'CHECKPOINT_MANIFEST.json'}
              for name,entry in meta['files'].items():
                  data=z.read(name)
                  assert len(data)==entry['bytes']
                  assert hashlib.sha256(data).hexdigest()==entry['sha256']
          print('M05 20% REMOTE ZIP VERIFIED',meta['bytes'],meta['sha256'])
          PY

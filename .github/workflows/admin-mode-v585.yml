name: Verify WEB-18 normal play and hidden admin
on:
  push:
    branches: [online-v575]
    paths: [".github/workflows/admin-mode-v585.yml"]
permissions:
  contents: write
jobs:
  package-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-v575
          fetch-depth: 1
      - name: Package the current normal game and five-press administrator gate
        run: |
          git fetch origin c66a8a9ee606d11db22f9ce9949ba19e4a032f06 --depth=1
          python3 tools/package_admin_mode_v585.py
          python3 tools/verify_site.py --dist dist
          python3 -m unittest discover -s tests -v
          node --test tests/web_client.test.cjs
          node tests/campaign_lightning.test.cjs
          node tests/monster_motion.test.cjs
          node tests/red_pulse.test.cjs
          node tests/boss_cinematic.test.cjs
      - name: Prepare native browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify normal start, hidden tools, real five-press unlock, collision editor, saves and game regressions
        timeout-minutes: 12
        run: |
          node tests/admin_mode_browser.cjs
          node tests/browser_smoke.cjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-web18-admin-verification
          path: test-results
          if-no-files-found: ignore
      - name: Save verified release checkpoint
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path('docs/admin-mode-v585-checkpoint.json');c=json.loads(p.read_text())
          c.update(progress=90,status='Normal stage-one and level-one start, five real codex clicks, administrator tools, collision editor, saves and reload behavior verified; ready for guarded deployment',next='Publish automatically and verify actual Pages build and administrator code')
          c['validation']={'packaging_and_unit_checks':'passed','normal_and_admin_browser':'passed','game_and_map_regressions':'passed','image_assets_unchanged':986,'physical_Galaxy_S23_plus_tested':False}
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          shutil.copyfile('test-results/admin-mode-browser.json','docs/ADMIN_MODE_BROWSER_REPORT.json')
          shutil.copyfile('test-results/browser-smoke.json','docs/WEB18_REGRESSION_BROWSER_REPORT.json')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- dist docs/admin-mode-v585-checkpoint.json docs/ADMIN_MODE_BROWSER_REPORT.json docs/WEB18_REGRESSION_BROWSER_REPORT.json
          git commit -m "[skip ci] WEB-18 90%: save verified normal game and hidden administrator build"
          git push origin HEAD:online-v575

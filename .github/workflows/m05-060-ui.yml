name: M05 60 percent mock store safety and mobile race checks
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-060-ui.yml'
permissions:
  contents: write
jobs:
  feature-build:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify original 50 percent and M04 contracts before incremental build
        run: |
          node --check web/m05-shop-ui-v618.js
          node --check tests/monetization_m05_060_browser.cjs
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Package next original-preserving hashed M05 UX60 build
        run: |
          python3 tools/build_m05_060.py
          python3 tools/verify_site.py --dist dist
      - name: Install mobile Chrome runner
        run: |
          npm install --prefix "$RUNNER_TEMP/m05-060-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/m05-060-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m05-060-browser/node_modules" >> "$GITHUB_ENV"
      - name: Run retained 50 percent ownership and 60 percent stress browser scenarios
        timeout-minutes: 19
        run: |
          node tests/monetization_m05_050_browser.cjs
          node tests/monetization_m05_060_browser.cjs
      - name: Retain mobile screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m05-060-mobile-errors-and-races
          path: |
            test-results/m05-050-owned-*.png
            test-results/m05-060-race-*.png
          if-no-files-found: ignore
      - name: Commit feature-only site when all functional tests pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/verification.json dist/asset-manifest.json
          git add -- 'dist/assets/*.js'
          git commit -m "build(M05 60%): original-safe error handling and mobile race tested UI"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028

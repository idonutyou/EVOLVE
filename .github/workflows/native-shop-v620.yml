name: V620 native SHOP replaces retired DEV overlay
on:
  push:
    branches: [feature/native-shop-unification-20261028]
    paths:
      - '.github/workflows/native-shop-v620.yml'
permissions:
  contents: write
jobs:
  native-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build normal SHOP, discard unused DEV storefront JS and verify original images
        run: |
          node --check web/native-shop-v620.js
          node --check web/mock-premium-v615.js
          node --check web/mock-core-visuals-v617.js
          node --check tests/native_shop_v620_browser.cjs
          python3 tools/build_native_shop_v620.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_monster_feedback_v614.py
          python3 tools/verify_m04_predeploy_gate.py
      - name: Install browser runner for actual mobile taps
        run: |
          npm install --prefix "$RUNNER_TEMP/native-shop" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/native-shop/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/native-shop/node_modules" >> "$GITHUB_ENV"
      - name: Test default SHOP on 3 screen sizes and original home/parts/combat
        timeout-minutes: 19
        run: |
          node tests/native_shop_v620_browser.cjs
          node tests/home_hub_browser.cjs
          node tests/arm_items_browser.cjs
          node tests/player_combat_browser.cjs
      - name: Preserve native SHOP screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-shop-v620-mobile
          path: test-results/native-shop-v620-*.png
          if-no-files-found: ignore
      - name: Save tested website and delete unused old DEV JS blobs from Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- dist
          git commit -m "release(native SHOP V620): display mock cosmetics in original SHOP, delete DEV modal scripts"
          git push origin HEAD:refs/heads/feature/native-shop-unification-20261028

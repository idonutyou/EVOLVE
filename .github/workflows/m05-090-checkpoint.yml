name: M05 90 percent immutable deployed-candidate recovery checkpoint
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-090-checkpoint.yml'
permissions:
  contents: write
  actions: read
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify persisted QA and byte-safe original assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/actions/runs/40576659951 --jq '.conclusion')" = success
          python3 tools/verify_m05_090_release.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Create immutable incremental M05 90 percent ZIP and independent CRC member check
        run: |
          python3 tools/checkpoint_m05_090.py
          python3 tools/verify_m05_090_checkpoint.py
      - name: Commit and push original-safe recovery ZIP and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_090_20261028.zip checkpoints/EVOLVE_M05_090_20261028.json
          git commit -m "checkpoint(M05 90%): verified production-safe original game and all mobile touch UI"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Re-fetch committed recovery ZIP from remote and rehash all member bytes
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_090_20261028.zip > "$RUNNER_TEMP/90.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_090_20261028.json > "$RUNNER_TEMP/90.json"
          python3 - "$RUNNER_TEMP/90.zip" "$RUNNER_TEMP/90.json" <<'PY'
          import hashlib,json,sys,zipfile
          b=open(sys.argv[1],'rb').read();m=json.load(open(sys.argv[2]))
          assert m['stage']=='M05' and m['percent']==90
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert not m['actual_billing_enabled']
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'CHECKPOINT_MANIFEST.json'}
              for p,x in m['files'].items():
                  data=z.read(p)
                  assert len(data)==x['bytes'] and hashlib.sha256(data).hexdigest()==x['sha256']
          print('M05 90% REMOTE ZIP VERIFIED',m['bytes'],m['sha256'],m['file_count'])
          PY

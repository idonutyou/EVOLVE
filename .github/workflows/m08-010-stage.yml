name: M08 focused stage and runtime missions
on:
  push:
    branches: ["monetization-m08-010-*"]
    paths:
      - "web/m08-stage-mission-v622.js"
      - "web/m08-runtime-missions-v623.js"
      - "dist/m08-stage-mission-v622.js"
      - "dist/m08-runtime-missions-v623.js"
      - "dist/index.html"
      - "tests/m08_010_live_stage.test.cjs"
      - "tests/m08_020_runtime_missions.test.cjs"
      - ".github/workflows/m08-010-stage.yml"
  workflow_dispatch:
jobs:
  focused-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrow syntax and live-stage/runtime event tests
        run: |
          node --check web/m08-stage-mission-v622.js
          node --check web/m08-runtime-missions-v623.js
          node --check dist/m08-stage-mission-v622.js
          node --check dist/m08-runtime-missions-v623.js
          node tests/m08_010_live_stage.test.cjs
          node tests/m08_020_runtime_missions.test.cjs
      - name: Hard-stop changes to combat, monster, original images or SHOP
        run: |
          git diff --name-only 55cc3054e07c5545ba7d3e12e64cadad75f6c34e HEAD > /tmp/m08-changed.txt
          if grep -E '^(web/|dist/|art/|assets/)' /tmp/m08-changed.txt | grep -Ev '^(web/m08-stage-mission-v622\.js|web/m08-runtime-missions-v623\.js|dist/m08-stage-mission-v622\.js|dist/m08-runtime-missions-v623\.js|dist/index\.html)$'; then
            echo "Unexpected protected game or original asset modification"; exit 1
          fi

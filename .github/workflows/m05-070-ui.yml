name: M05 70 percent responsive and accessible mobile UI
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-070-ui.yml'
permissions:
  contents: write
jobs:
  responsive-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate UX source and existing original image/manifests
        run: |
          node --check web/m05-shop-ui-v618.js
          node --check tests/monetization_m05_070_browser.cjs
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs tests/monetization_m05_product_detail.test.cjs
      - name: Package original-preserving M05 UX70 feature build
        run: |
          python3 tools/build_m05_070.py
          python3 tools/verify_site.py --dist dist
      - name: Install headless mobile Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/m05-070-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/m05-070-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m05-070-browser/node_modules" >> "$GITHUB_ENV"
      - name: Browser QA responsive orientation, focus, scroll, race and M04 ownership
        timeout-minutes: 22
        run: |
          node tests/monetization_m05_070_browser.cjs
          node tests/monetization_m05_050_browser.cjs
          node tests/monetization_m05_060_browser.cjs
      - name: Retain responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m05-070-mobile-portrait-landscape
          path: |
            test-results/m05-070-responsive-*.png
            test-results/m05-060-race-*.png
            test-results/m05-050-owned-*.png
          if-no-files-found: ignore
      - name: Commit only after original-safe functional browser QA succeeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/verification.json dist/asset-manifest.json
          git add -- 'dist/assets/*.js'
          git commit -m "build(M05 70%): tested mobile landscape keyboard scroll and repeated open behavior"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028

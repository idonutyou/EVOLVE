name: M07 040 isolated mission harness
on:
  push:
    branches: ["monetization-m07-retention-*"]
    paths:
      - "monetization/m07/**"
      - "tests/m07_040_mission_harness.test.cjs"
      - ".github/workflows/m07-040-harness.yml"
jobs:
  mission-prototype:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run M07 10-40 percent safety contract tests
        run: |
          node tests/m07_010_nonrender_design.test.cjs
          node tests/m07_020_period_contract.test.cjs
          node tests/m07_020_paid_month_policy.test.cjs
          node tests/m07_030_api_release_freeze.test.cjs
          node tests/m07_040_mission_harness.test.cjs
      - name: Preserve combat, graphics, merchant catalog and previous backups (V621 shop allowlist)
        run: |
          git diff --name-only b73c848a781e30453c3e003de673a98143fa5d42 HEAD > /tmp/m07-protected.txt
          if grep -E '^(web/|dist/|art/|assets/|monetization/m06/|monetization/catalog/|monetization/economy/)' /tmp/m07-protected.txt | grep -Ev '^(web/shop-experience-v621\.js|web/shop-front-v621\.js|dist/shop-experience-v621\.js|dist/shop-front-v621\.js|dist/index\.html)$'; then
            echo 'Forbidden change outside V621 shop experience.'
            exit 1
          fi

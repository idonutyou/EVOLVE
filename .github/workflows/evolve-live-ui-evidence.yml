      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify screenshot runner syntax
        run: node --check tests/evolve_live_browser_evidence.cjs
      - name: Prepare isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/evolve-live-qa" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/evolve-live-qa/node_modules" >> "$GITHUB_ENV"
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROME_BIN=$chrome" >> "$GITHUB_ENV"
          else
            "$RUNNER_TEMP/evolve-live-qa/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Ensure Korean text is visible in Chromium evidence
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          korean_fonts="$(fc-list :lang=ko)"
          if [ -z "$korean_fonts" ]; then
            font_dir="$HOME/.local/share/fonts/evolve-qa"
            mkdir -p "$font_dir"
            font_path="$font_dir/NotoSansKR.ttf"
            curl --fail --location --retry 1 --retry-delay 1 --connect-timeout 10 --max-time 75 \
              'https://raw.githubusercontent.com/google/fonts/4efc2774c63917927efe769ca845def6bd6debae/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf' --output "$font_path"
            echo '194018e6b2b293a7964f037b25c0249ce1418bc9ab3c971060a03aa57861e252  '"$font_path" | sha256sum --check
            fc-cache --force "$font_dir"
          fi
          korean_fonts="$(fc-list :lang=ko)"
          test -n "$korean_fonts"
      - name: Inspect real public EVOLVE HOME and capture all main UI pages
        timeout-minutes: 19
        env:
          EVOLVE_TEST_BASE_URL: https://idonutyou.github.io/EVOLVE/
          EVOLVE_CANDIDATE_DIR: ${{ startsWith(github.ref, 'refs/heads/qa/ui-unify-prerelease-') && 'dist' || '' }}
          EVOLVE_EXPECT_PUBLIC_BUILD: V717-SHOP-ORIGINAL-TEXTURE-REVIEW-20261117
        run: node tests/evolve_live_browser_evidence.cjs
      - name: Upload screenshots and JSON failure diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-live-ui-${{ github.run_id }}
          path: test-results/evolve-live-evidence/
          retention-days: 14
          if-no-files-found: warn


name: EVOLVE Public UI Browser Evidence (read-only)
on:
  push:
    branches: [main, feature/browser-qa-resilience-20261118, qa/ui-unify-prerelease-20261118]
    paths:
      - .github/workflows/evolve-live-ui-evidence.yml
      - tests/evolve_live_browser_evidence.cjs
      - dist/index.html
      - dist/version.json
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/evolve-live-ui-evidence.yml
      - tests/evolve_live_browser_evidence.cjs
  schedule:
    - cron: '15 0 * * *' # 09:15 Asia/Seoul, only after installed on default branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evolve-live-browser-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-evidence:
    name: Public game screenshot and error capture
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout only the browser evidence script (avoid 386 MB game assets)
        uses: actions/checkout@v4

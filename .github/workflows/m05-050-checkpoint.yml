name: M05 50 percent durable recovered owned-equip UI
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-050-checkpoint.yml'
      - 'tools/checkpoint_m05_050.py'
      - 'tools/verify_m05_050_checkpoint.py'
permissions:
  contents: write
jobs:
  checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original game integrity and 62 M04/M05 design+engine tests
        run: |
          node --check web/m05-shop-ui-v618.js
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Create checked ZIP of M05 50% actual build and changed project files
        run: |
          python3 tools/checkpoint_m05_050.py
          python3 tools/verify_m05_050_checkpoint.py
      - name: Commit recovery ZIP and proof without deleting old checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_M05_050_20261028.zip checkpoints/EVOLVE_M05_050_20261028.json
          git commit -m "checkpoint(M05): 50 percent owned/equip live tested recovery ZIP"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028
      - name: Retrieve persisted remote ZIP and independently rehash all members
        run: |
          git fetch origin monetization-m05-ux-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/monetization-m05-ux-20261028)"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_050_20261028.zip > "$RUNNER_TEMP/m05-050-remote.zip"
          git show origin/monetization-m05-ux-20261028:checkpoints/EVOLVE_M05_050_20261028.json > "$RUNNER_TEMP/m05-050-remote.json"
          python3 - "$RUNNER_TEMP/m05-050-remote.zip" "$RUNNER_TEMP/m05-050-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          payload=open(sys.argv[1],'rb').read()
          m=json.load(open(sys.argv[2]))
          assert m['stage']=='M05' and m['percent']==50
          assert len(payload)==m['bytes'] and hashlib.sha256(payload).hexdigest()==m['sha256']
          assert not m['live_billing_enabled']
          with zipfile.ZipFile(sys.argv[1]) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist())==set(m['files'])|{'CHECKPOINT_MANIFEST.json'}
              for p,proof in m['files'].items():
                  data=archive.read(p)
                  assert len(data)==proof['bytes']
                  assert hashlib.sha256(data).hexdigest()==proof['sha256']
          print('M05 50% REMOTE CHECKPOINT VERIFIED',m['bytes'],m['sha256'],m['file_count'])
          PY

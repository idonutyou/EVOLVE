name: M05 90 percent persist already browser-tested release candidate
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-090-persist.yml'
permissions:
  contents: write
  actions: read
jobs:
  save-tested-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require successful real mobile UI, game combat and original M04 steps from earlier run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for step in "Test REAL touch on five home tabs plus 80 percent core/combat safety" "Run M04/M05 original mock engine and 62 contract tests" "Build 90 percent opt-in DEV trigger placement fix"; do
            value="$(gh api repos/${{ github.repository }}/actions/jobs/122440938235 --jq ".steps[] | select(.name == \"$step\") | .conclusion")"
            test "$value" = "success" || { echo "QA evidence for $step is $value, refuse to persist"; exit 1; }
          done
          for path in web/m05-shop-ui-v618.js tools/build_m05_090.py tests/monetization_m05_090_touch_browser.cjs; do
            git show 8e66ca463d61729631270168c9d5e36039f6bc8a:"$path" | cmp - "$path" || { echo "Verified source changed, require complete retest: $path"; exit 1; }
          done
          echo "Prior Chromium QA source and all success conclusions verified."
      - name: Rebuild identical 90 percent hashed bundle on latest branch and audit originals
        run: |
          python3 tools/build_m05_090.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m05_090_release.py
          python3 tools/verify_m04_predeploy_gate.py
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Save QA-approved build without touching old checkpoints or main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/asset-manifest.json dist/verification.json 'dist/assets/*.js'
          git commit -m "build(M05 90%): persist previously verified touch-safe original-preserving DEV shell"
          git push origin HEAD:refs/heads/monetization-m05-ux-20261028

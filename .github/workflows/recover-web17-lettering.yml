name: Recover and verify WEB-17 lettering
on:
  push:
    branches: [online-v575]
    paths:
      - ".github/workflows/recover-web17-lettering.yml"
      - "tools/recover_web17_assets.py"
permissions:
  contents: write
concurrency:
  group: evolve-web17-recovery
  cancel-in-progress: false
jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: online-v575
          fetch-depth: 1
      - name: Prepare exact-image inspection
        run: python3 -m pip install --disable-pip-version-check pillow
      - name: Recover original images and package requested lettering
        run: python3 tools/recover_web17_assets.py
      - name: Verify packaging and gameplay boundaries
        run: |
          python3 tools/verify_site.py --dist dist
          python3 -m unittest discover -s tests -v
          node --test tests/web_client.test.cjs
          node tests/campaign_lightning.test.cjs
          node tests/monster_motion.test.cjs
          node tests/red_pulse.test.cjs
          node tests/boss_cinematic.test.cjs
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Verify both locales, native proportions, cinematic and existing gameplay
        timeout-minutes: 12
        run: |
          node tests/boss_cinematic_browser.cjs
          node tests/browser_smoke.cjs
          node tests/red_pulse_browser.cjs
          node tests/attack_warnings_browser.cjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-web17-recovery-verification
          path: test-results
          if-no-files-found: ignore
      - name: Save verified checkpoint
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          p=Path('docs/reference-lettering-v584-checkpoint.json')
          c=json.loads(p.read_text())
          c.update(progress=90,status='Final English boss names, Korean labels and exact reference ratio verified in both browser orientations; ready for automatic Pages deployment',next='Promote the verified WEB-17 checkpoint and confirm actual Pages publication',physical_Galaxy_S23_plus_tested=False)
          c['validation']={'unit_and_packaging_tests':'passed','full_browser_suite':'passed','locales':['en','ko'],'boss_names_English_in_both_locales':True,'native_venom_reference_aspect':13/3,'BIO_poison_pixels':0,'WEB16_warning_style_and_lifecycle':'byte-for-byte unchanged','physical_Galaxy_S23_plus_tested':False}
          p.write_text(json.dumps(c,ensure_ascii=False,indent=2)+'\n')
          for source,dest in [('boss-cinematic-browser.json','REFERENCE_LETTERING_BROWSER_REPORT.json'),('browser-smoke.json','WEB17_REGRESSION_BROWSER_REPORT.json'),('red-pulse-browser.json','WEB17_DEVICE_BROWSER_REPORT.json'),('attack-warnings-browser.json','WEB17_WARNINGS_BROWSER_REPORT.json')]:
              s=Path('test-results')/source
              if s.exists():shutil.copyfile(s,Path('docs')/dest)
          PY
          git add -- docs
          git commit -m "[skip ci] WEB-17 90%: record passing locale, proportion and regression checks"
          git push origin HEAD:online-v575

name: M05 10-30 shop and inventory UX design contract
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - 'monetization/m05/**'
      - 'tests/monetization_m05_ux_design.test.cjs'
      - 'tests/monetization_m05_product_detail.test.cjs'
      - '.github/workflows/m05-design-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux-design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged game assets and original images
        run: python3 tools/verify_site.py --dist dist
      - name: Check M05 design contract and M04 mock engine compatibility
        run: node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs

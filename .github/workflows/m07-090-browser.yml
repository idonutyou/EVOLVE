name: M07 090 full game SHOP browser
on:
  push:
    branches: ["monetization-m07-090-*"]
    paths:
      - "dist/index.html"
      - "dist/shop-*.js"
      - "web/shop-*.js"
      - "tests/m07_080_shop_browser.cjs"
      - "tests/home_hub_browser.cjs"
      - ".github/workflows/m07-090-browser.yml"
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Chromium/Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Full EVOLVE UI at 393, 320 and landscape; two equippable cores
        timeout-minutes: 14
        run: |
          node tests/m07_080_shop_browser.cjs
          node tests/home_hub_browser.cjs
      - name: Save screenshots and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolve-m07-090-shop-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore

name: M05 80 percent full-game premerge safety integration
on:
  push:
    branches: [monetization-m05-ux-20261028]
    paths:
      - '.github/workflows/m05-080-integration.yml'
      - 'tests/monetization_m05_080_integration_browser.cjs'
      - 'tools/verify_m05_080_integration.py'
permissions:
  contents: read
jobs:
  premerge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main M04 bytes unchanged and M05 dev-only source boundaries
        run: |
          python3 tools/verify_m05_080_integration.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_m04_predeploy_gate.py
          node --check tests/monetization_m05_080_integration_browser.cjs
      - name: Run complete 62 M04 and M05 Node contracts
        run: |
          node --test tests/monetization_m05_ux_design.test.cjs tests/monetization_m05_product_detail.test.cjs tests/monetization_m05_mobile_flow.test.cjs tests/monetization_m04_design.test.cjs tests/monetization_m04_mock_engine.test.cjs tests/monetization_m04_core_visuals.test.cjs
      - name: Install isolated Chrome mobile/browser QA runner
        run: |
          npm install --prefix "$RUNNER_TEMP/m05-080-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/m05-080-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/m05-080-browser/node_modules" >> "$GITHUB_ENV"
      - name: Run M05 core combat, original hub, parts and M04 original shop regressions
        timeout-minutes: 24
        run: |
          node tests/monetization_m05_080_integration_browser.cjs
          node tests/home_hub_browser.cjs
          node tests/arm_items_browser.cjs
          node tests/monetization_m04_home_browser.cjs
      - name: Preserve original-game and opt-in core integration QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m05-080-game-integration
          path: |
            test-results/m05-080-*.png
            test-results/home-hub-browser.json
            test-results/arm-items-browser.json
            test-results/m04-mock-shop-*.png
          if-no-files-found: ignore

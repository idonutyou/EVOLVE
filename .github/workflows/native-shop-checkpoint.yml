name: V620 native SHOP irreversible-deletion-safe recovery checkpoint
on:
  push:
    branches: [feature/native-shop-unification-20261028]
    paths:
      - '.github/workflows/native-shop-checkpoint.yml'
      - 'tools/checkpoint_native_shop_v620.py'
      - 'tools/verify_native_shop_v620_checkpoint.py'
permissions:
  contents: write
jobs:
  zip-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit all unchanged original resources and removed obsolete UI
        run: |
          python3 tools/verify_native_shop_v620.py
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_monster_feedback_v614.py
          python3 tools/verify_m04_predeploy_gate.py
      - name: Build deletion-aware recovery ZIP and verify members
        run: |
          python3 tools/checkpoint_native_shop_v620.py
          python3 tools/verify_native_shop_v620_checkpoint.py
      - name: Persist CRC/SHA backup without overwriting historic M05 checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- checkpoints/EVOLVE_NATIVE_SHOP_V620_20261028.zip checkpoints/EVOLVE_NATIVE_SHOP_V620_20261028.json
          git commit -m "checkpoint(native SHOP V620): full recovery overlay and legacy file deletion manifest"
          git push origin HEAD:refs/heads/feature/native-shop-unification-20261028
      - name: Read remote persisted ZIP and JSON, check every byte and all deletions
        run: |
          git fetch origin feature/native-shop-unification-20261028
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/native-shop-unification-20261028)"
          git show origin/feature/native-shop-unification-20261028:checkpoints/EVOLVE_NATIVE_SHOP_V620_20261028.zip > "$RUNNER_TEMP/native-remote.zip"
          git show origin/feature/native-shop-unification-20261028:checkpoints/EVOLVE_NATIVE_SHOP_V620_20261028.json > "$RUNNER_TEMP/native-remote.json"
          python3 - "$RUNNER_TEMP/native-remote.zip" "$RUNNER_TEMP/native-remote.json" <<'PY'
          import hashlib,json,sys,zipfile
          b=open(sys.argv[1],'rb').read();m=json.load(open(sys.argv[2]))
          assert m['stage']=='NATIVE_SHOP_V620' and m['site_asset_count']==1072
          assert len(b)==m['bytes'] and hashlib.sha256(b).hexdigest()==m['sha256']
          assert m['deleted_count']==16 and not m['real_checkout_enabled']
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert set(z.namelist())==set(m['files'])|{'CHECKPOINT_MANIFEST.json'}
              internal=json.loads(z.read('CHECKPOINT_MANIFEST.json'))
              assert internal['deleted_files']==m['deleted_paths']
              for p,v in m['files'].items():
                  data=z.read(p)
                  assert len(data)==v['bytes'] and hashlib.sha256(data).hexdigest()==v['sha256']
          print('REMOTE NATIVE SHOP V620 SHA/CRC DELETE MANIFEST VERIFIED',m['bytes'],m['sha256'],m['file_count'],m['deleted_count'])
          PY

name: M07 080 browser integration
on:
  push:
    branches: ["monetization-m07-retention-*"]
    paths:
      - "tests/m07_080_shop_browser.cjs"
      - "web/shop-*.js"
      - "dist/shop-*.js"
      - "dist/index.html"
      - ".github/workflows/m07-080-browser.yml"
  workflow_dispatch:
jobs:
  mobile-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Chromium browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          chrome_path="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$chrome_path" ]; then
            "$RUNNER_TEMP/evolve-browser/node_modules/.bin/playwright" install --with-deps chromium
          else
            echo "CHROME_BIN=$chrome_path" >> "$GITHUB_ENV"
          fi
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
      - name: Run actual in-game SHOP 393,320,landscape browser QA
        timeout-minutes: 10
        run: |
          node tests/m07_080_shop_browser.cjs
          node tests/home_hub_browser.cjs
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m07-080-shop-mobile-${{ github.run_id }}
          path: test-results/shop-v621-*.png
          if-no-files-found: ignore

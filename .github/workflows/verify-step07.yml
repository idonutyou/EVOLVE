name: STEP07 V614 candidate build and local checks
on:
  push:
    branches: [step07-monster-feedback-v614-20261027]
    paths:
      - 'web/monster-feedback-v614.js'
      - 'web/monster-feedback-adapter-v614.js'
      - 'tools/package_monster_feedback_v614.py'
      - 'tests/monster_feedback_v614.test.cjs'
      - '.github/workflows/verify-step07.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: step07-candidate-v614
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Lint and test visual-only source
        run: |
          node --check web/monster-feedback-v614.js
          node --check web/monster-feedback-adapter-v614.js
          node --test tests/monster_feedback_v614.test.cjs
      - name: Package exact V613 into independent V614 candidate
        run: |
          python3 tools/package_monster_feedback_v614.py
          python3 tools/verify_site.py --dist dist
          node --test tests/monster_feedback_v614.test.cjs tests/weapon_hits_v612.test.cjs tests/organ_hits_v613.test.cjs
          node tests/monster_motion.test.cjs
          node tests/campaign_lightning.test.cjs
      - name: Save candidate to private branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dist/index.html dist/version.json dist/asset-manifest.json dist/verification.json docs/step07/PACKAGE_V614.json docs/step07/ENGINE_PATCHES_V614.json docs/step07/IMPLEMENTATION_STATUS.json
          python3 - <<'PY'
          import json,subprocess
          p=json.load(open("docs/step07/PACKAGE_V614.json"))["engine"]
          subprocess.run(["git","add","--","dist/"+p],check=True)
          PY
          git diff --cached --quiet || git commit -m "STEP07 V614 candidate: reversible monster feedback engine [skip ci]"
          git push origin HEAD:step07-monster-feedback-v614-20261027
      - name: Retain local candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step07-candidate-local-tests
          path: |
            docs/step07/PACKAGE_V614.json
            docs/step07/ENGINE_PATCHES_V614.json
            docs/step07/IMPLEMENTATION_STATUS.json
          if-no-files-found: ignore

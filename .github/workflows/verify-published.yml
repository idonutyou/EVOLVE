name: Verify published EVOLVE
on:
  push:
    branches: [main]
    paths:
      - "docs/PUBLISHED_VERIFY_REQUEST.json"
      - ".github/workflows/verify-published.yml"
      - "tools/retry_public_browser.py"
      - "tools/verify_icons_fullscreen_v606.py"
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify original assets and published bytes
        run: |
          python3 tools/verify_site.py --dist dist
          python3 tools/verify_icons_fullscreen_v606.py --output test-results/icons-fullscreen-live-bytes.json
      - name: Prepare browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/evolve-browser" --no-save --no-audit --no-fund --ignore-scripts playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/evolve-browser/node_modules" >> "$GITHUB_ENV"
          echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify the actual published home and fullscreen
        run: |
          python3 tools/retry_public_browser.py --url https://idonutyou.github.io/EVOLVE/ --script tests/home_hub_browser.cjs --report test-results/home-hub-live-browser.json
          python3 tools/retry_public_browser.py --url https://idonutyou.github.io/EVOLVE/ --script tests/visual_fit_browser.cjs --report test-results/visual-fit-live-browser.json
          python3 tools/retry_public_browser.py --url https://idonutyou.github.io/EVOLVE/ --script tests/fullscreen_browser.cjs --report test-results/fullscreen-live-browser.json
      - name: Retain exact public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-evolve-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: ignore
